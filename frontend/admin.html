<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAGForge Chatbot Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="logo">
      <h1>RAGForge Admin</h1>
      <p>Manage &amp; train your website chatbot</p>
    </div>
    <nav class="nav">
<button data-nav="overview">Overview</button>
<button data-nav="kb">Knowledge Base</button>
<button data-nav="publish">Publish</button>
<button data-nav="faqs">FAQs</button>
<button data-nav="urls">Website Content</button>
<button data-nav="business">Business & Pricing</button>
<button data-nav="instructions">Instructions</button>
<button data-nav="appearance">Appearance</button>
<button data-nav="support">Human Support</button>
<button data-nav="chat">Conversations</button>
<button data-nav="unanswered">Unanswered <span class="badge" id="unansweredBadge" style="display:none">0</span></button>
<button data-nav="analytics">Analytics</button>
<button data-nav="embed">Embed & Deploy</button>
<button data-nav="settings">Settings & Backup</button>
    </nav>
    <div class="side-foot">Data is stored in this browser. Publish sends it to your RAGForge backend.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h2 id="pageTitle">Overview</h2>
      <span class="status-dot" id="backendStatus">● Checking backend...</span>
    </div>
    <div id="pageRoot"></div>
  </main>
</div>
<script src="admin.js" defer></script>
</body>
</html>
